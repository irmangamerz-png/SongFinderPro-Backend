<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sistem Limit & Mode Keluarga</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Kontrol Sistem</h2>
        <input type="password" id="pinInput" placeholder="Masukkan PIN Mode Keluarga (Opsional)">
        <button onclick="triggerSystem()">Kirim Permintaan</button>
        <div id="result"></div>
    </div>
    <script>
        async function triggerSystem() {
            const pin = document.getElementById('pinInput').value;
            const res = await fetch('/api/trigger', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: 'user_123', pin })
            });
            const data = await res.json();
            document.getElementById('result').innerText = data.message || data.error;
            document.getElementById('result').style.color = res.ok ? 'green' : 'red';
        }
    </script>
</body>
</html>
